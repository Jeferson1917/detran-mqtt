services:
  # Broker responsável por receber e distribuir as mensagens MQTT.
  broker:
    image: eclipse-mosquitto:2
    container_name: detran-mqtt-broker

    # Expõe a porta MQTT para a máquina host.
    ports:
      - "1883:1883"

    # Monta a configuração do Mosquitto e mantém seus dados persistentes.
    volumes:
      - ./broker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Microserviço responsável pelas operações de emplacamento e IPVA.
  emplacamento:
    build:
      context: ./emplacamento

    container_name: detran-mqtt-emplacamento

    # O microserviço precisa do broker para conseguir se comunicar.
    depends_on:
      - broker

    # Microserviço responsável pelo cadastro de condutores e propriedade.
  condutores:
    build:
      context: ./condutores

    container_name: detran-mqtt-condutores

    # O microserviço precisa do broker para se comunicar via MQTT.
    depends_on:
      - broker
      
volumes:
  # Volumes utilizados para persistir dados e logs do broker.
  mosquitto_data:
  mosquitto_log: